name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency: release

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile --filter flitz
      - name: Check that the chart's image is in the repository owner's registry
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          grep -qx "  repository: $registry/flitz" charts/flitz/values.yaml
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
      - id: release
        name: Release with semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
      - if: steps.release.outputs.version
        uses: docker/setup-qemu-action@v4
      - if: steps.release.outputs.version
        uses: docker/setup-buildx-action@v4
      - if: steps.release.outputs.version
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.release.outputs.version
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/flitz
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.release.outputs.version }}
      - if: steps.release.outputs.version
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: steps.release.outputs.version
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - if: steps.release.outputs.version
        name: Push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          helm package charts/flitz
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "flitz-$VERSION.tgz" "oci://$REGISTRY/charts"
