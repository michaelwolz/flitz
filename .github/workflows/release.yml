name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version to resume, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.release.outputs.run }}
      ref: ${{ steps.release.outputs.ref }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: release
        name: Check the release commit or recovery version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/check-release-request.sh

  release:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.ref }}
          fetch-depth: 0
      - name: Confirm the checkout matches the release request
        if: needs.check.outputs.version == ''
        env:
          EXPECTED_SHA: ${{ needs.check.outputs.ref }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Check recovery version contents
        if: needs.check.outputs.version != ''
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          grep -Fqx "  \"version\": \"$VERSION\"," apps/server/package.json
          grep -Fqx "version: $VERSION" charts/flitz/Chart.yaml
          grep -Fqx "appVersion: \"$VERSION\"" charts/flitz/Chart.yaml
      - name: Prepare the draft release for recovery
        if: needs.check.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft --jq .isDraft > release-state 2>/dev/null; then
            if [[ "$(cat release-state)" != true ]]; then
              echo "Release $tag is already published; refusing to overwrite its artifacts." >&2
              exit 1
            fi
          else
            gh release create "$tag" --verify-tag --draft --generate-notes
          fi
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - run: pnpm install --frozen-lockfile --filter flitz
      - name: Check that the chart's image is in the repository owner's registry
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          grep -qx "  repository: $registry/flitz" charts/flitz/values.yaml
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
      - id: release
        if: needs.check.outputs.version == ''
        name: Release with semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
      - id: version
        name: Set the artifact version
        env:
          RECOVERY_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          version="${RECOVERY_VERSION:-$RELEASE_VERSION}"
          if [[ -n "$version" ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.version
        uses: docker/setup-qemu-action@v4
      - if: steps.version.outputs.version
        uses: docker/setup-buildx-action@v4
      - if: steps.version.outputs.version
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.version.outputs.version
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/flitz
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
      - if: steps.version.outputs.version
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: steps.version.outputs.version
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1
      - if: steps.version.outputs.version
        name: Push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package charts/flitz
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "flitz-$VERSION.tgz" "oci://$REGISTRY/charts"
      - if: steps.version.outputs.version
        name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false
