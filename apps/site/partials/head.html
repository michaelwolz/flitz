<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#FF6B5B" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="flitz" />
<meta property="og:image" content="%SITE_URL%/og.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/svg+xml" href="../../docs/brand/favicon.svg" />
<link
  rel="preload"
  href="./node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link
  rel="preload"
  href="./node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2"
  as="font"
  type="font/woff2"
  crossorigin
/>
<link rel="stylesheet" href="./src/site.css" />
<script>
  document.documentElement.classList.add("js");
  (() => {
    const media = matchMedia("(prefers-color-scheme: dark)");
    const system = () => (media.matches ? "dark" : "light");
    let chosen = null;
    try {
      chosen = localStorage.getItem("theme");
    } catch {}
    const apply = () => {
      const dark = (chosen ?? system()) === "dark";
      document.documentElement.classList.toggle("dark", dark);
      for (const button of document.querySelectorAll(".theme-toggle")) {
        button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      }
    };
    apply();
    document.addEventListener("DOMContentLoaded", apply);
    addEventListener("pageshow", (event) => {
      if (!event.persisted) return;
      try {
        chosen = localStorage.getItem("theme");
      } catch {}
      apply();
    });
    media.addEventListener("change", apply);
    document.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      const menuButton = target.closest(".menu-toggle");
      if (menuButton) {
        const header = menuButton.closest(".site-header");
        if (!header) return;
        const open = menuButton.getAttribute("aria-expanded") !== "true";
        header.classList.toggle("menu-open", open);
        menuButton.setAttribute("aria-expanded", String(open));
        menuButton.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
        return;
      }
      if (target.closest(".site-nav a")) {
        const header = target.closest(".site-header");
        if (header) {
          header.classList.remove("menu-open");
          const button = header.querySelector(".menu-toggle");
          button?.setAttribute("aria-expanded", "false");
          button?.setAttribute("aria-label", "Open navigation");
        }
        return;
      }
      if (!target.closest(".site-header")) {
        document.querySelectorAll(".site-header.menu-open").forEach((header) => {
          header.classList.remove("menu-open");
          const button = header.querySelector(".menu-toggle");
          button?.setAttribute("aria-expanded", "false");
          button?.setAttribute("aria-label", "Open navigation");
        });
      }
      if (!event.target.closest(".theme-toggle")) return;
      const next = document.documentElement.classList.contains("dark") ? "light" : "dark";
      chosen = next === system() ? null : next;
      try {
        if (chosen) localStorage.setItem("theme", chosen);
        else localStorage.removeItem("theme");
      } catch {}
      apply();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      const header = document.querySelector(".site-header.menu-open");
      if (!header) return;
      header.classList.remove("menu-open");
      const button = header.querySelector(".menu-toggle");
      button?.setAttribute("aria-expanded", "false");
      button?.setAttribute("aria-label", "Open navigation");
      button?.focus();
    });
  })();
</script>
