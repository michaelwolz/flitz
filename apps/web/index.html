<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140A26" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="../../docs/brand/favicon.svg" />
    <title>flitz</title>
    <script>
      try {
        const theme = localStorage.getItem("theme") ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
