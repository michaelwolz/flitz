{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "flitz.fullname" . }}
  labels:
    {{- include "flitz.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml (.Values.httpRoute.hostnames | default (list (include "flitz.hostname" .))) | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "flitz.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
