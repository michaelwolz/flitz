{{- if include "flitz.hasSecrets" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flitz.fullname" . }}
  labels:
    {{- include "flitz.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := .Values.secrets }}
  {{- if $value }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
