apiVersion: v1
kind: Service
metadata:
  name: {{ include "flitz.fullname" . }}
  labels:
    {{- include "flitz.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "flitz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
