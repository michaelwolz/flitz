x-environment: &environment
  DATABASE_URL: &database-url postgres://flitz:flitz@postgres:5432/flitz
  AUTH_SECRET: ${AUTH_SECRET:-local-only-secret-replace-before-going-public}
  BASE_URL: ${BASE_URL:-http://localhost:3000}
  ADMIN_EMAILS:
  SIGNUP_DOMAINS:
  DEFAULT_ROLE:
  DISABLE_PASSWORD_AUTH:
  TRUSTED_PROXIES:
  SMTP_URL:
  SMTP_FROM:
  GOOGLE_CLIENT_ID:
  GOOGLE_CLIENT_SECRET:
  GITHUB_CLIENT_ID:
  GITHUB_CLIENT_SECRET:
  MICROSOFT_CLIENT_ID:
  MICROSOFT_CLIENT_SECRET:
  MICROSOFT_TENANT_ID:
  RATE_LIMIT_REDIRECTS_PER_MINUTE:
  GEOIP_DATABASE: ${GEOIP_DATABASE:-/app/geoip/dbip-country-lite.mmdb}
  IMPRINT_URL:
  PRIVACY_POLICY_URL:

services:
  server:
    build: .
    image: flitz
    ports:
      - "127.0.0.1:3000:3000"
    environment: *environment
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s

  worker:
    image: flitz
    command: ["worker"]
    environment: *environment
    depends_on:
      server:
        condition: service_healthy

  seed:
    image: flitz
    profiles: [demo]
    entrypoint: ["node", "packages/db/src/seed.ts"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      server:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flitz
      POSTGRES_PASSWORD: flitz
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flitz"]
      interval: 2s

volumes:
  postgres:
