pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,mjs,cjs,ts,tsx}"
      run: pnpm exec oxlint --deny-warnings {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
